<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Luke Villaluz — portfolio. Work, photography, music, and contact, shown across a MacBook, camera, iPod, and phone."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='50' font-size='86' text-anchor='middle' dominant-baseline='central'>😛</text></svg>"
    />
    <title>Luke Villaluz</title>

    <!-- Link previews (LinkedIn, iMessage, Slack, X). og:image must be an
         absolute URL, so it points at the unhashed file in public/. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Luke Villaluz" />
    <meta property="og:title" content="Luke Villaluz" />
    <meta
      property="og:description"
      content="Portfolio — work, photography, music, and contact, shown across a MacBook, camera, iPod, and phone."
    />
    <meta property="og:url" content="https://lukevillaluz.com/" />
    <meta property="og:image" content="https://lukevillaluz.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>

    <script type="module" src="/src/main.jsx"></script>
